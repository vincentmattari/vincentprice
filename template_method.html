<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산출 방법론 · 재고 적정 판매가</title>
<style>
:root{
  color-scheme: light;
  --surface-1:#fcfcfb; --plane:#f9f9f7;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --accent:#2a78d6; --warn:#d03b3b;
}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])){
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d;
  --ink-1:#fff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --warn:#d03b3b;
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --surface-1:#1a1a19; --plane:#0d0d0d;
  --ink-1:#fff; --ink-2:#c3c2b7; --ink-3:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --warn:#d03b3b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink-1);
  font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.72;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding:28px 20px 90px;position:relative}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;
  flex-wrap:wrap;margin-bottom:26px}
.btn{border:1px solid var(--axis);background:var(--surface-1);color:var(--ink-1);
  border-radius:7px;padding:8px 14px;font:inherit;font-size:13px;font-weight:560;
  cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--accent);color:var(--accent)}
h1{font-size:29px;line-height:1.25;margin:0 0 8px;letter-spacing:-.022em}
h2{font-size:21px;margin:44px 0 12px;letter-spacing:-.015em;padding-top:6px}
h3{font-size:16.5px;margin:30px 0 8px;letter-spacing:-.01em;color:var(--ink-1)}
h4{font-size:14.5px;margin:26px 0 8px;color:var(--ink-1);
  padding-left:11px;border-left:3px solid var(--accent)}
p{margin:0 0 14px;color:var(--ink-2)}
strong{color:var(--ink-1);font-weight:640}
hr{border:0;border-top:1px solid var(--grid);margin:34px 0}
ul{margin:0 0 16px;padding-left:22px;color:var(--ink-2)}
li{margin-bottom:7px}
code{background:var(--surface-1);border:1px solid var(--ring);border-radius:4px;
  padding:1.5px 5px;font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--ink-1)}
pre.eq{background:var(--surface-1);border:1px solid var(--ring);
  border-left:3px solid var(--accent);border-radius:7px;padding:14px 16px;margin:16px 0;
  font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.65;
  overflow-x:auto;color:var(--ink-1);white-space:pre}
blockquote.warn{border:0;border-left:3px solid var(--warn);
  background:color-mix(in srgb,var(--warn) 8%,transparent);
  border-radius:7px;padding:13px 16px;margin:18px 0;color:var(--ink-2)}
blockquote.warn strong{color:var(--ink-1)}
.tblwrap{overflow-x:auto;border:1px solid var(--ring);border-radius:9px;
  background:var(--surface-1);margin:16px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 13px;text-align:left;border-bottom:1px solid var(--grid);
  color:var(--ink-2);white-space:nowrap}
th{background:var(--surface-1);color:var(--ink-1);font-size:12px;font-weight:640;
  box-shadow:inset 0 -1px var(--axis)}
tbody tr:last-child td{border-bottom:0}
td:not(:first-child){font-variant-numeric:tabular-nums}
.foot{margin-top:50px;padding-top:18px;border-top:1px solid var(--grid);
  font-size:13px;color:var(--ink-3)}
.foot a{color:var(--accent)}
@media(max-width:640px){.wrap{padding:20px 14px 60px}h1{font-size:23px}h2{font-size:18.5px}body{font-size:14.5px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav">
    <a class="btn" href="index.html">← 산출 결과로 돌아가기</a>
    <button class="btn" id="thm" type="button">◐ 테마</button>
  </div>
<!--__CONTENT__-->
  <p class="foot">이 문서는 <code>산출방법론.md</code>에서 생성됩니다 —
  내용을 고치려면 <code>.md</code>를 수정하고 <code>python build_price.py</code>를 실행하세요.<br>
  <a href="index.html">산출 결과 페이지</a></p>
</div>
<script>
document.getElementById("thm").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-theme", dark?"light":"dark");};
</script>
</body>
</html>
